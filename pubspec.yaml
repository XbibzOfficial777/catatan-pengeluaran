name: catatan_pengeluaran
description: "Catatan Pengeluaran — pencatatan pengeluaran, hutang, dan lampiran foto."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  flutter_contacts: ^2.3.1
  image_editor_plus: ^1.0.8
  archive: ^4.1.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  cross_file: ^0.3.5+4
  excel_plus: ^0.0.3

dependency_overrides:
  font_awesome_flutter:
    path: vendor/font_awesome_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
