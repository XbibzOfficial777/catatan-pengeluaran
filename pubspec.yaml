name: catatan_pengeluaran
description: "Catatan Pengeluaran — pencatatan pengeluaran, hutang, dan lampiran foto."
publish_to: 'none'
version: 1.3.1+10

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  flutter_contacts: ^2.3.1
  image_editor_plus: ^1.0.8
  archive: ^4.1.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  cross_file: ^0.3.5+4
  excel_plus: ^0.0.3
  xml: ^7.0.1
  crypto: ^3.0.7
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  home_widget: ^0.9.3
  pdf: ^3.11.3
  printing: ^5.14.2

dependency_overrides:
  archive: ^4.1.0
  xml: ^7.0.1
  font_awesome_flutter:
    path: vendor/font_awesome_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brands/
