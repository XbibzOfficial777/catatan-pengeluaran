name: catatan_pengeluaran
description: "Catatan Pengeluaran — pencatatan pengeluaran, hutang, dan lampiran foto."
publish_to: 'none'
version: 1.5.0+20

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  flutter_contacts: ^2.1.0
  image_editor_plus: ^1.0.8
  archive: 3.6.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  file_picker:
    path: vendor/file_picker
  share_plus: ^12.0.2
  cross_file: ^0.3.5+2
  excel: ^4.0.6
  xml: ^6.6.1
  crypto: ^3.0.7
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  flutter_local_notifications: ^20.1.0
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_markdown_plus: ^1.0.7
  fl_chart: 0.70.2
  flutter_svg: ^2.3.0
  google_mlkit_text_recognition: 0.16.0
  home_widget: ^0.9.2+1
  pdf: 3.11.3
  printing: ^5.14.3

dependency_overrides:
  archive: 3.6.1
  xml: ^6.6.1
  font_awesome_flutter:
    path: vendor/font_awesome_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brands/
