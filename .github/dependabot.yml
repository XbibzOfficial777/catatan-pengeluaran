# Dependabot version updates.
# - github-actions: update workflow actions (checkout, setup-java, dsb).
# - pub (beta): update dependency pub.dev di pubspec.yaml.
#   Catatan: dependency path/git (mis. vendor/file_picker) tidak dikelola
#   Dependabot dan tetap dirawat manual.
# - gradle: update plugin/konstanta Android pada direktori /android.
version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
