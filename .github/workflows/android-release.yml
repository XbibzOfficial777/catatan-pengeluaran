name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Fast test and build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo 'Missing ANDROID_KEYSTORE_BASE64 secret' >&2; exit 1)
          test -n "$STORE_PASSWORD" || (echo 'Missing ANDROID_KEYSTORE_PASSWORD secret' >&2; exit 1)
          test -n "$KEY_PASSWORD" || (echo 'Missing ANDROID_KEY_PASSWORD secret' >&2; exit 1)
          mkdir -p android/keystores
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystores/xbibzofcv1.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=xbibzofcv1
          storeFile=keystores/xbibzofcv1.jks
          EOF
          chmod 600 android/key.properties android/keystores/xbibzofcv1.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Configure fast CI build
        run: |
          sed -i 's/-Xmx768m/-Xmx4g/' android/gradle.properties
          sed -i 's/org.gradle.workers.max=1/org.gradle.workers.max=2/' android/gradle.properties
          sed -i 's/org.gradle.parallel=false/org.gradle.parallel=true/' android/gradle.properties
          # R8/resource shrinking stays enabled in the sandbox release build.
          # CI uses fast mode so tags produce a release quickly.
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/' android/app/build.gradle.kts

      - name: Build arm64-v8a fast release APK
        run: >-
          flutter build apk --release --target-platform android-arm64
          --no-shrink --no-tree-shake-icons

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Catatan-Pengeluaran-arm64-v8a.apk
          cp build/app/outputs/apk/release/app-release.apk.idsig release-assets/Catatan-Pengeluaran-arm64-v8a.apk.idsig
          sha256sum release-assets/Catatan-Pengeluaran-arm64-v8a.apk release-assets/Catatan-Pengeluaran-arm64-v8a.apk.idsig > release-assets/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catatan-pengeluaran-arm64-v8a-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Catatan Pengeluaran ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            APK optimized Catatan Pengeluaran untuk Android 7–16.

            - Target arsitektur: `arm64-v8a`.
            - CI memakai fast mode arm64-v8a agar release cepat; APK sandbox tetap dibuild dengan R8 minification dan resource shrinking penuh.
            - Release ditandatangani dengan APK Signature Scheme v2, v3, dan v4; v1/JAR signing dinonaktifkan.
            - Fast mode CI menonaktifkan shrink/obfuscation hanya untuk kecepatan; APK sandbox dapat dibuild dengan kompresi penuh.
            - `Catatan-Pengeluaran-arm64-v8a.apk.idsig` adalah berkas signature v4 untuk Android 11+.
            - `SHA256SUMS.txt` tersedia untuk verifikasi checksum APK dan idsig.
