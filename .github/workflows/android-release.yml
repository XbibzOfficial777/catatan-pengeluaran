name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Build optimized APKs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split ABI release APKs
        run: >-
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols

      - name: Rename APKs
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Catatan-Pengeluaran-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/Catatan-Pengeluaran-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/Catatan-Pengeluaran-x86_64.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catatan-pengeluaran-apks-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Catatan Pengeluaran ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            APK release Catatan Pengeluaran untuk Android 7–16.

            - `arm64-v8a`: perangkat Android modern 64-bit.
            - `armeabi-v7a`: perangkat Android 32-bit/lebih lama.
            - `x86_64`: emulator atau perangkat x86_64.
            - `SHA256SUMS.txt`: checksum untuk verifikasi file.

            Build menggunakan R8 minification, resource shrinking, tree-shaking icon, obfuscation Dart, split debug symbols, dan split ABI.
