name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Test and build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Configure Gradle for CI runner
        run: |
          sed -i 's/-Xmx768m/-Xmx4g/' android/gradle.properties
          sed -i 's/org.gradle.workers.max=1/org.gradle.workers.max=2/' android/gradle.properties
          sed -i 's/org.gradle.parallel=false/org.gradle.parallel=true/' android/gradle.properties

      - name: Build arm64-v8a release APK
        run: >-
          flutter build apk --release --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols

      - name: Prepare release asset
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Catatan-Pengeluaran-arm64-v8a.apk
          sha256sum release-assets/Catatan-Pengeluaran-arm64-v8a.apk > release-assets/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catatan-pengeluaran-arm64-v8a-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Catatan Pengeluaran ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            APK optimized Catatan Pengeluaran untuk Android 7–16.

            - Target arsitektur: `arm64-v8a`.
            - Build memakai R8 minification, resource shrinking, tree-shaking icon, Dart obfuscation, dan split debug symbols.
            - `SHA256SUMS.txt` tersedia untuk verifikasi checksum.
